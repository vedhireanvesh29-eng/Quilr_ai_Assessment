name: assessment-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v --junitxml=results.xml
        if: always()
      - run: uv run python scripts/benchmark.py
        if: always()
      - name: Measure services and render PNG plots
        if: always()
        run: uv run --with matplotlib==3.10.7 python scripts/benchmark_report.py
      - name: Format benchmark source for review
        if: always()
        run: |
          uv run ruff check --fix scripts/benchmark_report.py || true
          uv run ruff format scripts/benchmark_report.py
          uv run python -c "import json,pathlib; print('ASSESSMENT_SOURCE=' + json.dumps(pathlib.Path('scripts/benchmark_report.py').read_text()))"
          uv run ruff check scripts/benchmark_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            results.xml
            uv.lock
            docs/metrics.json
            docs/images/*.png
