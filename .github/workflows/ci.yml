name: assessment-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v --junitxml=results.xml
        if: always()
      - run: uv run python scripts/verify_all.py
      - run: uv run python scripts/benchmark.py
        if: always()
      - name: Measure services and render PNG plots
        if: runner.os == 'Linux'
        env:
          EXPORT_REPORT_ASSETS: '1'
        run: uv run --with matplotlib==3.10.7 python scripts/benchmark_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ runner.os }}
          path: |
            results.xml
            uv.lock
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: measured-performance
          path: |
            docs/metrics.json
            docs/images/*.png
